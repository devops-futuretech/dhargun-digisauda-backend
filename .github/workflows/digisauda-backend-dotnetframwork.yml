# ==========================================================================================
# Digital Sauda - .NET Framework IIS CI/CD
# This is the CALLER workflow.
# It is consumed from the centralized reusable-workflow repository.
#   Caller
#      |
#      v
#   Reusable .NET Framework Workflow
#      |
#      +--> Setup .NET Framework Action
#      |
#      +--> Build / Package
#      |
#      +--> Upload Artifact Action
#      |
#      v
#   Manual Approval
# ==========================================================================================

name: Digital Sauda - .NET Framework IIS

on:
  # pull_request:
  #   branches: ["features/*", "develop", "uat", "release/*", "main"]
  #   paths:
  #     - "backend/**"

  # push:
  #   branches: ["features/*", "develop", "uat", "release/*", "main"]
  #   paths:
  #     - "backend/**"

  workflow_dispatch:
    inputs:
      target-environment:
        required: false
        type: choice
        options: [dev, UAT, PROD]

# concurrency:
#   group: digital-sauda-backend-${{ github.ref }}
#   cancel-in-progress: true
  

# Enterprise best practice:
# Give the workflow only the permissions it currently requires.
permissions:
  contents: read

jobs:

  determine-environment:
      name: Determine Environment
      if: github.event_name != 'pull_request'
      runs-on: [windows-latest]
      outputs:
        environment: ${{ steps.map.outputs.environment }}
      steps:
        - id: map
          shell: bash
          run: |
            if [ -n "${{ inputs.target-environment }}" ]; then
              echo "environment=${{ inputs.target-environment }}" >> "$GITHUB_OUTPUT"; exit 0
            fi
            case "${GITHUB_REF_NAME}" in
              develop)   echo "environment=dev" >> "$GITHUB_OUTPUT" ;;
              uat)       echo "environment=UAT" >> "$GITHUB_OUTPUT" ;;
              release/*) echo "environment=STAGING" >> "$GITHUB_OUTPUT" ;;
              main)      echo "environment=PROD" >> "$GITHUB_OUTPUT" ;;
              *)          echo "environment=dev" >> "$GITHUB_OUTPUT" ;;
            esac

  validate:
    name: Common Validation
    needs: [determine-environment]
    if: always() && !failure()
    uses: devops-futuretech/dhargun-ghactions-reusable-workflows/.github/workflows/awl-common-validation.yml@main
    with:
      environment: ${{ needs.determine-environment.outputs.environment || 'dev' }}
      runner-label: windows-build       # override if the default label targets Linux

  # ------------------------------------------------------------------------------------
  # Security Scan — GitHub-native tooling only (GitHub Advanced Security), per current decision.
  # No third-party scanning actions (gitleaks/npm-audit/etc.) are used here.
  # ------------------------------------------------------------------------------------
  security-scan:
    name: Security Scan (GitHub Advanced Security)
    needs: [determine-environment, validate]
    runs-on: [windows-latest]
    permissions:
      contents: read
      security-events: write   # required so CodeQL can upload SARIF results to the Security tab
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      # Dependency Review — GitHub-native, PR-time only. Flags newly introduced vulnerable
      # or license-flagged dependencies using the repo's Dependency Graph. Requires
      # Settings > Code security > Dependency graph to be enabled (org-level default setup).
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      # CodeQL — GitHub-native SAST. Findings appear under the repo's Security tab, not in
      # workflow logs only. Language below must match this repo's primary source language.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      # If autobuild fails for this project type, replace with explicit build commands
      # (dotnet build / msbuild / ./gradlew build etc.) matching the awl-build-*.yml step.
      - name: Build for CodeQL
        shell: pwsh
        run: |
          & "C:\Program Files\Microsoft Visual Studio\18\Enterprise\MSBuild\Current\Bin\MSBuild.exe" `
            "AdaniWilmar.Solution\AdaniWilmar.Solution.sln" `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:SkipInvalidConfigurations=true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Build for CodeQL
        shell: pwsh
        run: |
          & "C:\Program Files\Microsoft Visual Studio\18\Enterprise\MSBuild\Current\Bin\MSBuild.exe" `
            "AdaniWilmar.Solution\AdaniWilmar.Solution.sln" `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:SkipInvalidConfigurations=true

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v3

      # Secret scanning + push protection are GitHub-native, ORG-level features
      # (Org Settings > Code security > Secret scanning). They run automatically on every
      # push — no workflow step required. Confirm both are ON for this repo before go-live.

  # ========================================================================================
  # BUILD
  # [REUSABLE WORKFLOW]
  # This workflow is located in the SEPARATE reusable-workflow repository:
  # dhargun-ghactions-reusable-workflows
  #   └── .github
  #       └── workflows
  #           └── reusable-build-dotnet-framework-iis.yml
  #
  # The reusable workflow internally uses:
  #
  # [REUSABLE ACTION]
  #   .github/actions/awl-setup-dotnet-framework
  #
  # [REUSABLE ACTION]
  #   .github/actions/awl-upload-artifact
  #
  # We therefore do NOT call those actions directly from this caller.
  # ========================================================================================
  build-mvc:
    name: Build ASP.NET MVC
    needs: [determine-environment, validate]
    uses: devops-futuretech/dhargun-ghactions-reusable-workflows/.github/workflows/reusable-build-dotnet-framework-iis.yml@main

    with:
      environment: ${{ needs.determine-environment.outputs.environment || 'dev' }}
      # ------------------------------------------------------------------------------------
      # [APPLICATION REPO PATH]
      # This path is inside THIS application repository.
      # Testing structure:
      # vije-digitalsauda/
      # └── adaniwilmar.solution/
      #     └── adaniwilmar.Solution.sln
      #
      # CHANGE ONLY THIS VALUE if your actual testing path is different.
      solution-path: "AdaniWilmar.Solution/AdaniWilmar.Solution.sln"
      # ------------------------------------------------------------------------------------
      # [APPLICATION REPO PATH]
      # Testing structure:
      # adaniwilmar.solution/
      # └── Adani.Solution.mvc/
      #     └── Adani.Solution.mvc.csproj
      #
      # CHANGE ONLY THIS VALUE if your actual testing path is different.
      # ------------------------------------------------------------------------------------
      project-path: AdaniWilmar.Solution/Adani.Solution.MVC/Adani.Solution.MVC.csproj
      configuration: Release
      artifact-name: digital-sauda-mvc-${{ github.sha }}
      artifact-path: publish


  
  build-api:
    name: Build ASP.NET API
    needs: [determine-environment, validate, security-scan]
    uses: devops-futuretech/dhargun-ghactions-reusable-workflows/.github/workflows/reusable-build-dotnet-framework-iis.yml@main
    with:
      environment: ${{ needs.determine-environment.outputs.environment || 'dev' }}
        # ------------------------------------------------------------------------------------
      # [APPLICATION REPO PATH]
      # This path is inside THIS application repository.
      # Testing structure:
      # vije-digitalsauda/
      # └── adaniwilmar.solution/
      #     └── adaniwilmar.Solution.sln
      #
      # CHANGE ONLY THIS VALUE if your actual testing path is different.

      solution-path: "AdaniWilmar.Solution/AdaniWilmar.Solution.sln"
       # ------------------------------------------------------------------------------------
      # [APPLICATION REPO PATH]
      # Testing structure:
      # adaniwilmar.solution/
      # └── Adani.Solution.mvc/
      #     └── Adani.Solution.mvc.csproj
      #
      # CHANGE ONLY THIS VALUE if your actual testing path is different.
      # ------------------------------------------------------------------------------------

      project-path: AdaniWilmar.Solution/Adani.Solution.API/Adani.Solution.API.csproj
      configuration: Release
      artifact-name: digital-sauda-api-${{ github.sha }}   # Artifact name visible under: # GitHub Actions → Workflow run → Artifacts
      artifact-path: publish # [BUILD OUTPUT] # This folder is generated by the reusable workflow # It is NOT an application source path.
 
  # ========================================================================================
  # APPROVAL
  #
  # This is only to test the GitHub Environment approval.
  #
  # No deployment is performed here.
  #
  # Later, deployment can be placed AFTER this job:
  #
  #     approval
  #        |
  #        v
  #     deployment
  #
  # If approval is not granted, deployment will not proceed.
  # ========================================================================================

  approval:
    name: deployment Approval
    needs:
      - determine-environment
      - build-mvc
      - build-api
    runs-on: windows-latest
    # [GITHUB ENVIRONMENT]
    # Create this environment in the APPLICATION repository:
    # Settings
    #   → Environments
    #       → DEPLOY-APPROVAL
    # Configure Required Reviewers there.
    # --------------------------------------------------------------------------------------     
    
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: Approval Completed
        shell: pwsh
        run: |
          Write-Host "Build completed successfully."
          Write-Host "Artifact has been uploaded by the reusable workflow."
          Write-Host "Manual approval completed."
          Write-Host "Deployment is intentionally not configured for this test."

  deploy:
    name: Deploy to IIS
    needs: [ approval]
    if: github.event_name == 'push'
    uses: devops-futuretech/dhargun-ghactions-reusable-workflows/.github/workflows/awl-reusable-deploy-iis.yml@main
    with:
      environment: ${{ needs.determine-environment.outputs.environment || 'dev' }}
      # artifact-path: publish
      artifact-name: digital-sauda-web-${{ github.run_number }}
      site-name: ${{ vars.IIS_SITE_NAME }}   # [ENV var] Target IIS website name on the Windows deploy runner
      app-pool: ${{ vars.IIS_APP_POOL }}   # [ENV var] IIS application pool name
      physical-path: ${{ vars.IIS_PHYSICAL_PATH }}   # [ENV var] Physical folder path on the IIS server for this environment
      backup-enabled: true
      enable-health-check: true
      health-url: ${{ vars.HEALTH_CHECK_URL }}   # [ENV var] Post-deploy health endpoint used by the health-check step

  release:
    name: Create Release
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [windows-latest]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag Release
        shell: bash
        run: |
          VERSION="v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}-backend"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git tag "$VERSION"
          git push origin "$VERSION"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          generate_release_notes: true
