# ==========================================================================================
# Digital Sauda - .NET Framework IIS CI/CD
# This is the CALLER workflow.
# It is consumed from the centralized reusable-workflow repository.
#   Caller
#      |
#      v
#   Reusable .NET Framework Workflow
#      |
#      +--> Setup .NET Framework Action
#      |
#      +--> Build / Package
#      |
#      +--> Upload Artifact Action
#      |
#      v
#   Manual Approval
# ==========================================================================================

name: Digital Sauda - .NET Framework IIS

on:
  workflow_dispatch:

# Enterprise best practice:
# Give the workflow only the permissions it currently requires.
permissions:
  contents: read

jobs:

  # ========================================================================================
  # BUILD
  # [REUSABLE WORKFLOW]
  # This workflow is located in the SEPARATE reusable-workflow repository:
  # dhargun-ghactions-reusable-workflows
  #   └── .github
  #       └── workflows
  #           └── reusable-build-dotnet-framework-iis.yml
  #
  # The reusable workflow internally uses:
  #
  # [REUSABLE ACTION]
  #   .github/actions/awl-setup-dotnet-framework
  #
  # [REUSABLE ACTION]
  #   .github/actions/awl-upload-artifact
  #
  # We therefore do NOT call those actions directly from this caller.
  # ========================================================================================

  build:
    name: Build .NET Framework IIS
    uses: devops-futuretech/dhargun-ghactions-reusable-workflows/.github/workflows/reusable-build-dotnet-framework-iis.yml@main
    with:

      # ------------------------------------------------------------------------------------
      # [APPLICATION REPO PATH]
      #
      # This path is inside THIS application repository.
      #
      # Testing structure:
      #
      # vije-digitalsauda/
      # └── adaniwilmar/
      #     └── DigitalSauda.sln
      #
      # CHANGE ONLY THIS VALUE if your actual testing path is different.
      # ------------------------------------------------------------------------------------
      solution-path: "adaniwilmar/DigitalSauda.sln"

      # ------------------------------------------------------------------------------------
      # [APPLICATION REPO PATH]
      # Testing structure:
      # adaniwilmar/
      # └── src/
      #     └── DigitalSauda.Web/
      #         └── DigitalSauda.Web.csproj
      #
      # CHANGE ONLY THIS VALUE if your actual testing path is different.
      # ------------------------------------------------------------------------------------
      project-path: "adaniwilmar/src/DigitalSauda.Web/DigitalSauda.Web.csproj"

      configuration: Release

      # Artifact name visible under:
      # GitHub Actions → Workflow run → Artifacts
      artifact-name: digital-sauda-web-${{ github.run_number }}

      # ------------------------------------------------------------------------------------
      # [BUILD OUTPUT]
      #
      # This folder is generated by the reusable workflow.
      # It is NOT an application source path.
      # ------------------------------------------------------------------------------------
      artifact-path: publish


  # ========================================================================================
  # APPROVAL
  #
  # This is only to test the GitHub Environment approval.
  #
  # No deployment is performed here.
  #
  # Later, deployment can be placed AFTER this job:
  #
  #     approval
  #        |
  #        v
  #     deployment
  #
  # If approval is not granted, deployment will not proceed.
  # ========================================================================================

  approval:
    name: Build Approval

    needs:
      - build

    runs-on: windows-latest

    # --------------------------------------------------------------------------------------
    # [GITHUB ENVIRONMENT]
    #
    # Create this environment in the APPLICATION repository:
    #
    # Settings
    #   → Environments
    #       → BUILD-APPROVAL
    #
    # Configure Required Reviewers there.
    # --------------------------------------------------------------------------------------

    environment:
      name: BUILD-APPROVAL

    steps:

      - name: Approval Completed
        shell: pwsh
        run: |
          Write-Host "Build completed successfully."
          Write-Host "Artifact has been uploaded by the reusable workflow."
          Write-Host "Manual approval completed."
          Write-Host "Deployment is intentionally not configured for this test."